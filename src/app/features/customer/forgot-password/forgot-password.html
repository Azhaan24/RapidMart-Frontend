<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-md">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8">

      <!-- Icon -->
      <div class="flex justify-center mb-5">

        <div
          class="w-16 h-16 rounded-full flex items-center justify-center"
          style="background-color: #fff1eb;"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-8 h-8"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            style="color: #f94b1a;"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 7a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"
            />

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 14v7m0 0H8m4 0h4"
            />
          </svg>

        </div>

      </div>


      <!-- Heading -->
      <div class="text-center mb-7">

        <h1
          class="text-2xl font-bold"
          style="color: #0B2A4A;"
        >
          Forgot Password?
        </h1>

        <p class="text-gray-500 text-sm mt-2">
          Enter the email address associated with your
          RapidMart account.
        </p>

      </div>


      <!-- Error -->
      @if (errorMessage()) {

        <div
          class="mb-5 p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm"
        >
          {{ errorMessage() }}
        </div>

      }


      <!-- Form -->
      <form
        (ngSubmit)="submit()"
      >

        <!-- Email -->
        <div class="mb-5">

          <label
            for="forgotEmail"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            Email
          </label>

          <input
            id="forgotEmail"
            name="email"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            placeholder="Enter your email"
            required
            autocomplete="email"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-orange-400
                   focus:border-transparent"
          />

        </div>


        <!-- Submit -->
        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="w-full py-3 rounded-lg text-white font-semibold cursor-pointer
                 transition disabled:opacity-60 disabled:cursor-not-allowed"
          style="background-color: #f94b1a;"
        >

          @if (!isSubmitting()) {

            <span>
              Continue
            </span>

          } @else {

            <span>
              Generating reset request...
            </span>

          }

        </button>

      </form>


      <!-- Back to Login -->
      <div class="mt-6 text-center">

        <button
          type="button"
          (click)="goToLogin()"
          class="text-sm font-semibold hover:underline cursor-pointer"
          style="color: #f94b1a;"
        >
          ← Back to Login
        </button>

      </div>

    </div>

  </div>

</div>
