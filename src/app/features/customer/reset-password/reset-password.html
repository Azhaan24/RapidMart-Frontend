<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-md">

    <div class="bg-white rounded-2xl shadow-xl p-8">

      <!-- Icon -->
      <div class="flex justify-center mb-5">

        <div
          class="w-16 h-16 rounded-full flex items-center justify-center"
          style="background-color: #fff1eb;"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-8 h-8"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            style="color: #f94b1a;"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2z"
            />

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 10V7a4 4 0 018 0v3"
            />
          </svg>

        </div>

      </div>


      <!-- Heading -->
      <div class="text-center mb-7">

        <h1
          class="text-2xl font-bold"
          style="color: #0B2A4A;"
        >
          Reset Password
        </h1>

        <p class="text-gray-500 text-sm mt-2">
          Create a new password for your RapidMart account.
        </p>

      </div>


      <!-- Error -->
      @if (errorMessage()) {

        <div
          class="mb-5 p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm"
        >
          {{ errorMessage() }}
        </div>

      }


      <!-- Success -->
      @if (successMessage()) {

        <div
          class="mb-5 p-3 rounded-lg bg-green-50 border border-green-200 text-green-600 text-sm"
        >
          {{ successMessage() }}
        </div>

      }


      @if (email() && token()) {

        <form
          (ngSubmit)="submit()"
        >

          <!-- Email -->
          <div class="mb-4">

            <label
              for="resetEmail"
              class="block text-sm font-medium text-gray-700 mb-2"
            >
              Email
            </label>

            <input
              id="resetEmail"
              name="email"
              type="email"
              [value]="email()"
              readonly
              class="w-full px-4 py-3 border border-gray-200 rounded-lg
                     bg-gray-50 text-gray-500"
            />

          </div>


          <!-- New Password -->
          <div class="mb-4">

            <label
              for="newPassword"
              class="block text-sm font-medium text-gray-700 mb-2"
            >
              New Password
            </label>

            <input
              id="newPassword"
              name="newPassword"
              type="password"
              [ngModel]="newPassword()"
              (ngModelChange)="newPassword.set($event)"
              placeholder="Enter new password"
              required
              autocomplete="new-password"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-orange-400
                     focus:border-transparent"
            />

          </div>


          <!-- Confirm Password -->
          <div class="mb-5">

            <label
              for="confirmPassword"
              class="block text-sm font-medium text-gray-700 mb-2"
            >
              Confirm Password
            </label>

            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              [ngModel]="confirmPassword()"
              (ngModelChange)="confirmPassword.set($event)"
              placeholder="Confirm new password"
              required
              autocomplete="new-password"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-orange-400
                     focus:border-transparent"
            />

          </div>


          <!-- Submit -->
          <button
            type="submit"
            [disabled]="isSubmitting()"
            class="w-full py-3 rounded-lg text-white font-semibold hover:cursor-pointer
                   transition disabled:opacity-60 disabled:cursor-not-allowed"
            style="background-color: #f94b1a;"
          >

            @if (!isSubmitting()) {

              <span>
                Reset Password
              </span>

            } @else {

              <span>
                Resetting Password...
              </span>

            }

          </button>

        </form>

      } @else {

        <!-- Invalid request -->
        <div class="text-center">

          <p class="text-sm text-gray-500 mb-5">
            Please start the password reset process again.
          </p>

          <button
            type="button"
            (click)="goToLogin()"
            class="font-semibold hover:underline cursor-pointer"
            style="color: #f94b1a;"
          >
            Back to Login
          </button>

        </div>

      }

    </div>

  </div>

</div>
