<div class="min-h-[80vh] flex items-center justify-center px-4 py-10 bg-gray-50">

  <div
    class="w-full max-w-lg bg-white rounded-2xl shadow-lg border border-gray-100 p-8"
  >

    <!-- Heading -->
    <div class="text-center mb-8">

      <h1
        class="text-3xl font-bold"
        style="color: #0B2A4A;"
      >
        Create Your Account
      </h1>

      <p class="text-gray-500 mt-2">
        Join RapidMart and start shopping.
      </p>

    </div>


    <!-- Alert Message -->
    <div
      *ngIf="alertMessage"
      class="mb-6 p-4 rounded-lg text-sm font-medium"
      [ngClass]="{
        'bg-green-50 text-green-700 border border-green-200':
          alertType === 'success',

        'bg-red-50 text-red-700 border border-red-200':
          alertType === 'error'
      }"
    >

      <div class="flex items-start gap-3">

        <!-- Success icon -->
        <svg
          *ngIf="alertType === 'success'"
          class="w-5 h-5 flex-shrink-0 mt-0.5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M5 13l4 4L19 7"
          />
        </svg>


        <!-- Error icon -->
        <svg
          *ngIf="alertType === 'error'"
          class="w-5 h-5 flex-shrink-0 mt-0.5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>

        <div class="flex-1">

  <span>
    {{ alertMessage }}
  </span>

  <!-- Login button after successful registration -->
  <div
    *ngIf="registrationSuccessful"
    class="mt-3"
  >
    <button
      type="button"
      (click)="goToLogin()"
      class="px-4 py-2 rounded-lg text-white text-sm font-semibold hover:opacity-90 transition"
      style="background-color: #0B2A4A;"
    >
      Go to Login
    </button>
  </div>

</div>

      </div>

    </div>


    <!-- Registration Form -->
    <form (ngSubmit)="register()">

      <!-- First Name -->
      <div class="mb-4">

        <label
          for="firstName"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          First Name
        </label>

        <input
          id="firstName"
          name="firstName"
          type="text"
          [(ngModel)]="firstName"
          placeholder="Enter your first name"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>


      <!-- Last Name -->
      <div class="mb-4">

        <label
          for="lastName"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          Last Name
        </label>

        <input
          id="lastName"
          name="lastName"
          type="text"
          [(ngModel)]="lastName"
          placeholder="Enter your last name"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>


      <!-- Email -->
      <div class="mb-4">

        <label
          for="registerEmail"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          Email
        </label>

        <input
          id="registerEmail"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>


      <!-- Phone -->
      <div class="mb-4">

        <label
          for="phoneNumber"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          Phone Number
          <span class="text-gray-400">(Optional)</span>
        </label>

        <input
          id="phoneNumber"
          name="phoneNumber"
          type="tel"
          [(ngModel)]="phoneNumber"
          placeholder="Enter your phone number"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>


      <!-- Password -->
      <div class="mb-6">

        <label
          for="registerPassword"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          Password
        </label>

        <input
          id="registerPassword"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Create a password"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>


      <!-- Confirm Password -->
      <div class="mb-6">

        <label
          for="confirmRegisterPassword"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          Confirm Password
        </label>

        <input
          id="confirmRegisterPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="Enter yout password again"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>


      <!-- Register Button -->
      <button
        type="submit"
        [disabled]="isRegistering"
        class="w-full py-3 rounded-lg text-white font-semibold transition hover:opacity-90 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
        style="background-color: #f94b1a;"
      >

        <span *ngIf="!isRegistering">
          Create Account
        </span>

        <span *ngIf="isRegistering">
          Creating Account...
        </span>

      </button>

    </form>


    <!-- Login -->
    <div class="mt-6 text-center">

      <p class="text-sm text-gray-500">
        Already have an account?
      </p>

      <button
        type="button"
        (click)="goToLogin()"
        class="mt-1 font-semibold hover:underline cursor-pointer"
        style="color: #f94b1a;"
      >
        Login to your account
      </button>

    </div>

  </div>

</div>
